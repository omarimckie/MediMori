name: Engineering validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:engineering
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run security:check
      - run: npm run build
        env:
          MARKETING_STORE: memory
          MARKETING_MOCK_MODE: 'true'
      - run: npm run test:engineering:http
