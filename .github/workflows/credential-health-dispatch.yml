# Daily OpenAI + Meta credential probes (independent of marketing publish).
# Vercel Hobby allows only one Vercel-managed daily cron per project; this
# GitHub schedule is the primary scheduler for /api/cron/credential-health.

name: Credential health dispatch

on:
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:

concurrency:
  group: credential-health-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/credential-health
        env:
          MARKETING_PUBLISH_BASE_URL: ${{ vars.MARKETING_PUBLISH_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${MARKETING_PUBLISH_BASE_URL}" ]; then
            echo "::error::Set repository variable MARKETING_PUBLISH_BASE_URL (e.g. https://twilight-feather.com)."
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Set repository secret CRON_SECRET (must match Vercel production CRON_SECRET)."
            exit 1
          fi

          BASE="${MARKETING_PUBLISH_BASE_URL%/}"
          URL="${BASE}/api/cron/credential-health"
          echo "Dispatch target: ${URL}"
          echo "Auth: Bearer CRON_SECRET (value not logged)"

          HTTP_CODE="$(
            curl -sS -o /tmp/credential-health-response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "${URL}"
          )"

          echo "HTTP status: ${HTTP_CODE}"

          node <<'NODE'
          const fs = require("fs");
          const path = "/tmp/credential-health-response.json";
          let raw = "";
          try {
            raw = fs.readFileSync(path, "utf8");
          } catch {
            console.log("Response body: (empty)");
            process.exit(0);
          }
          let body;
          try {
            body = JSON.parse(raw);
          } catch {
            console.log("Response body (non-JSON, truncated):", raw.slice(0, 400));
            process.exit(0);
          }
          if (body.error) {
            console.log("application error:", body.error);
          }
          if (body.openai) {
            console.log("openai daily:", JSON.stringify(body.openai));
          }
          if (body.meta) {
            console.log("meta daily:", JSON.stringify(body.meta));
          }
          if (body.integrations) {
            console.log("integrations daily:", JSON.stringify(body.integrations));
          }
          NODE

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Credential health dispatcher failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Credential health dispatch completed successfully."
