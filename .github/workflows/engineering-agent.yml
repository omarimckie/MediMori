name: Engineering agent scaffold
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:engineering
      - run: npm run engineering:preflight
      - run: echo 'Scaffold validated. Model calls, repository writes and production operations remain disabled.'
